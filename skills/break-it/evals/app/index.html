<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot · Projects</title>
<style>
  :root { --ink: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --tint: #f2f2f7; --accent: #2f6fed; --danger: #c62828; --radius: 8px; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--ink); }
  .page { max-width: 640px; margin: 48px auto; padding: 0 24px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .button { font: inherit; padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--ink); cursor: pointer; }
  .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .input { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
  .new { display: flex; gap: 8px; }
  .new .input { flex: 1; }
  .error { color: var(--danger); margin: 8px 0 0; }
  .filters { display: flex; gap: 4px; margin: 24px 0 8px; }
  .chip { font: inherit; padding: 4px 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--tint); color: var(--ink); }
  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .title { white-space: nowrap; }
  .row .button { margin-left: auto; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main class="page">
  <h1>Projects</h1>
  <form class="new" id="new">
    <input class="input" name="name" placeholder="Project name" required>
    <button class="button primary">Create</button>
  </form>
  <p class="error" id="error" hidden>Couldn't create the project. Try again.</p>
  <div class="filters">
    <button class="chip on" type="button" data-filter="all">All</button>
    <button class="chip" type="button" data-filter="active">Active</button>
    <button class="chip" type="button" data-filter="archived">Archived</button>
  </div>
  <ul class="list" id="list"></ul>
</main>
<script>
  let projects = [], filter = 'all';
  const list = document.getElementById('list');

  function render() {
    const shown = projects.filter((p) => filter === 'all' || p.status === filter);
    list.innerHTML = '';
    if (!shown.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = filter === 'all' ? 'No projects yet' : `No ${filter} projects`;
      list.append(empty);
      return;
    }
    for (const p of shown) {
      const row = document.createElement('li');
      row.className = 'row';
      row.innerHTML = '<span class="title"></span><button class="button" type="button">Open</button>';
      row.querySelector('.title').textContent = p.name;
      list.append(row);
    }
  }

  render();
  fetch('/api/projects').then((r) => r.json()).then((data) => { projects = data; render(); });

  for (const chip of document.querySelectorAll('.chip')) {
    chip.addEventListener('click', () => {
      filter = chip.dataset.filter;
      document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
      render();
    });
  }

  document.getElementById('new').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.target, error = document.getElementById('error'), name = form.name.value.trim();
    try {
      const res = await fetch('/api/projects', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }),
      });
      if (!res.ok) throw new Error(String(res.status));
      const made = await res.json().catch(() => ({}));
      projects.unshift({ id: made.id ?? Date.now(), name: made.name ?? name, status: 'active' });
      error.hidden = true;
      form.reset();
      render();
    } catch {
      error.hidden = false;
    }
  });
</script>
</body>
</html>
