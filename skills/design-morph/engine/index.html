<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
__HEAD__
<style>
/* Theater: the film fills the window height on a quiet ground; caption and transport sit under it.
   --sw, --sh and --arn (the stage size and its ratio) are set by player.js from scene.json. */
:root{
  --sw:1440; --sh:900; --arn:1.6; --accent:#00e05a;
  --ground:#e6e3dd; --ink:#1d1a15; --ink-3:#908b85;
  --accent-text:color-mix(in oklab,var(--accent) 55%,#000);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#11100e; --ink:#e7e2da; --ink-3:#6c675f; --accent-text:var(--accent); color-scheme:dark}}
:root[data-theme="dark"]{--ground:#11100e; --ink:#e7e2da; --ink-3:#6c675f; --accent-text:var(--accent); color-scheme:dark}
html,body{background:var(--ground);color:var(--ink);margin:0}
body{font-family:var(--ui);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.theater{--w:min(1280px,calc((100vh - 340px)*var(--arn)));width:max(min(100%,640px),var(--w));max-width:100%;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--ink-3);font-size:13px}
.stagewrap{position:relative;width:100%;display:grid;justify-items:center}
.stage{position:relative;width:min(100%,var(--w));aspect-ratio:var(--sw)/var(--sh);border-radius:18px;overflow:hidden;background:#121212;box-shadow:0 1px 0 #ffffff10 inset,0 12px 40px #0000001f}
.stagewrap:fullscreen{place-items:center;background:#0b0a08}
.stagewrap:fullscreen .stage{width:min(100vw,calc(100vh*var(--arn)));border-radius:0}
.world{position:absolute;left:0;top:0;width:calc(var(--sw)*1px);height:calc(var(--sh)*1px);transform-origin:0 0}
.card-title{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#0b0a08;color:#f3f0ea;z-index:20;pointer-events:none;text-align:center;padding:0 6%}
.card-title .n{font-size:clamp(12px,1.1vw,14px);font-weight:600;letter-spacing:.12em;color:var(--accent)}
.card-title .t{font-family:var(--ui);font-size:clamp(28px,5vw,68px);font-weight:600;letter-spacing:-.02em}
.caption{margin:0;font-size:16px;line-height:1.5;color:var(--ink);min-height:4.5em;max-width:72ch;text-wrap:pretty}
.caption .ch{display:block;font-size:13px;font-weight:600;color:var(--accent-text);margin-bottom:2px}
/* the stage alone, for frames and the MP4 (__film.chrome(false, width)) */
body.bare{padding:0}
body.bare header,body.bare .caption,body.bare .dk{display:none}
body.bare .theater{width:var(--bare-w,1920px);max-width:none;gap:0;margin:0}
body.bare .stage{width:var(--bare-w,1920px);border-radius:0;box-shadow:none}

/* Transport, in DialKit's language: a glass panel of 36px rows on faint surfaces. */
.dk{--dial-surface:rgba(0,0,0,.04);--dial-surface-hover:rgba(0,0,0,.08);--dial-surface-active:rgba(0,0,0,.1);
  --dial-text-label:rgba(0,0,0,.6);--dial-text-primary:rgba(0,0,0,.9);--dial-text-tertiary:rgba(0,0,0,.35);
  --dial-border:rgba(0,0,0,.1);--dial-border-hover:rgba(0,0,0,.15);--dial-glass-bg:#fafafa;--dial-shadow:0 4px 20px rgba(0,0,0,.08);
  --dial-radius:8px;--dial-row:36px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{--dial-surface:rgba(255,255,255,.05);--dial-surface-hover:rgba(255,255,255,.1);--dial-surface-active:rgba(255,255,255,.11);
  --dial-text-label:rgba(255,255,255,.7);--dial-text-primary:rgba(255,255,255,.95);--dial-text-tertiary:rgba(255,255,255,.4);
  --dial-border:rgba(255,255,255,.1);--dial-border-hover:rgba(255,255,255,.15);--dial-glass-bg:#212121;--dial-shadow:0 8px 32px rgba(0,0,0,.5)}}
:root[data-theme="dark"] .dk{--dial-surface:rgba(255,255,255,.05);--dial-surface-hover:rgba(255,255,255,.1);--dial-surface-active:rgba(255,255,255,.11);
  --dial-text-label:rgba(255,255,255,.7);--dial-text-primary:rgba(255,255,255,.95);--dial-text-tertiary:rgba(255,255,255,.4);
  --dial-border:rgba(255,255,255,.1);--dial-border-hover:rgba(255,255,255,.15);--dial-glass-bg:#212121;--dial-shadow:0 8px 32px rgba(0,0,0,.5)}
.dk{background:var(--dial-glass-bg);border:1px solid var(--dial-border);border-radius:14px;padding:10px 12px;box-shadow:var(--dial-shadow);display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--dial-text-label);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.dk-row{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.dk-btn{flex:none;height:var(--dial-row);min-width:var(--dial-row);padding:0 10px;border:0;border-radius:var(--dial-radius);background:var(--dial-surface);color:var(--dial-text-primary);cursor:pointer;display:grid;place-items:center;transition:background .15s}
.dk-btn:hover{background:var(--dial-surface-hover)}
.dk-btn .pl{width:0;height:0;border-left:10px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.dk-btn .pz{width:9px;height:11px;border-left:3px solid currentColor;border-right:3px solid currentColor;box-sizing:border-box}
.dk-btn svg{width:16px;height:16px}
.dk-slider{position:relative;flex:1;min-width:160px;height:var(--dial-row);border-radius:var(--dial-radius);background:var(--dial-surface);overflow:hidden;cursor:pointer;touch-action:none;user-select:none}
.dk-fill{position:absolute;left:0;top:0;bottom:0;background:var(--dial-surface-active);transition:background .15s;pointer-events:none}
.dk-slider.on .dk-fill,.dk-slider:hover .dk-fill{background:var(--dial-border-hover)}
.dk-handle{position:absolute;top:50%;width:3px;height:20px;border-radius:999px;background:var(--dial-text-primary);transform:translate(-50%,-50%);pointer-events:none}
.dk-mark{position:absolute;top:50%;width:1px;height:8px;border-radius:999px;background:var(--dial-border);transform:translate(-50%,-50%);pointer-events:none;transition:background .2s}
.dk-mark.act{height:20px;background:var(--dial-border-hover)}
.dk-slider.on .dk-mark,.dk-slider:hover .dk-mark{background:var(--dial-border-hover)}
.dk-label{position:absolute;left:10px;top:50%;transform:translateY(calc(-50% - .5px));color:var(--dial-text-label);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 120px)}
.dk-label b{font-weight:500;color:var(--dial-text-primary)}
.dk-value{position:absolute;right:12px;top:50%;transform:translateY(calc(-50% + .5px));color:var(--dial-text-label);pointer-events:none}
.dk-slider.on .dk-value{color:var(--dial-text-primary)}
.dk-seg{position:relative;display:flex;padding:2px;border-radius:var(--dial-radius);background:var(--dial-surface);flex:none}
.dk-seg[hidden]{display:none}
.dk-seg .pill{position:absolute;top:2px;bottom:2px;left:0;border-radius:6px;background:var(--dial-surface-active);transition:transform .25s cubic-bezier(.16,1,.3,1),width .25s cubic-bezier(.16,1,.3,1);pointer-events:none}
.dk-seg button{position:relative;z-index:1;border:0;background:none;padding:6px 8px;height:32px;font:inherit;cursor:pointer;color:var(--dial-text-label);transition:color .15s}
.dk-seg button[aria-pressed="true"]{color:var(--dial-text-primary)}
.dk-cap{color:var(--dial-text-tertiary);padding:0 2px 0 6px;flex:none}
.dk-toggle{flex:none;display:flex;align-items:center;gap:10px;height:var(--dial-row);padding:0 10px 0 12px;border:0;border-radius:var(--dial-radius);background:var(--dial-surface);color:var(--dial-text-label);font:inherit;cursor:pointer;transition:background .15s}
.dk-toggle:hover{background:var(--dial-surface-hover)}
.dk-toggle[aria-checked="true"]{color:var(--dial-text-primary)}
.dk-track{position:relative;width:36px;height:20px;border-radius:10px;background:var(--dial-surface-active);transition:background .2s}
.dk-toggle[aria-checked="true"] .dk-track{background:var(--accent)}
.dk-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--dial-text-primary);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.dk-toggle[aria-checked="true"] .dk-thumb{transform:translateX(16px);background:#fff}
.dk-spacer{flex:1}
@media (max-width:640px){.dk-cap,#speedSeg{display:none}.caption{font-size:15px}.dk-label{max-width:calc(100% - 100px)}}

/* ---------- the film's base elements (SCENE.md lists the classes); a scene adds its own in scene.css ---------- */
.layer,.layer-in{position:absolute;left:0;top:0;width:calc(var(--sw)*1px);height:calc(var(--sh)*1px)}
.el{position:absolute;left:0;top:0;box-sizing:border-box;overflow:hidden;white-space:nowrap;border:0 solid transparent;transform-origin:center;line-height:1.25}
.el .t{position:absolute;inset:0;display:flex;align-items:center;padding-left:var(--pl,0px);font-family:var(--f-new)}
.el .t.to,.el .t.nO{font-family:var(--f-old)}
.el.center .t{justify-content:center;text-align:center;padding-left:0}
.el.centerN .t.nO,.el.centerN .t.nN{justify-content:center;text-align:center;padding-left:0}
.el.right .t{justify-content:flex-end}
.el.wrap{white-space:normal;overflow:visible}
.el.wrap .t{white-space:normal}
.el .ic{position:absolute;inset:0;display:grid;place-items:center}
.el .ic i{display:block;width:100%;height:100%;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.el .ic img{width:100%;height:100%;object-fit:contain;display:block}
.el.pad4 .ic{inset:4px}.el.pad6 .ic{inset:6px}.el.pad8 .ic{inset:8px 12px}.el.pad9 .ic{inset:9px}
.el img.m,.el .m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.el.contain img.m{object-fit:contain}
.el .pl{position:absolute;inset:0;overflow:hidden}
.el .pl>div{position:absolute;background-repeat:no-repeat;background-size:100% 100%}
.el .plfade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,var(--fade,transparent) 96%)}
.el.fadeleft{-webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%)}
.el .lg{position:absolute;inset:0;display:block}
.el .lg svg{width:100%;height:100%;display:block}
.el img.lg{width:100%;height:100%;object-fit:contain}
.mi{display:inline-block;width:1.1em;height:1.1em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;margin-right:3px;flex:none}
.push{margin-left:auto}
.ell{overflow:hidden;text-overflow:ellipsis}
.two{display:grid;gap:1px;min-width:0;width:100%}
.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:10}
</style>
<style id="dm-scene-css">
__CSS__
</style>

<div class="theater">
  <header>
    <h1>__TITLE__</h1>
    <p>__SUB__</p>
  </header>
  <div id="stagewrap" class="stagewrap">
    <div class="stage" id="stage" role="img" aria-label="__ARIA__">
      <div class="world" id="world"></div>
      <div class="card-title" id="card"><span class="n"></span><span class="t"></span></div>
    </div>
  </div>
  <p class="caption" id="caption" aria-live="polite"></p>
  <div class="dk" role="group" aria-label="Playback">
    <div class="dk-row">
      <button class="dk-btn" id="play" type="button" aria-label="Pause"></button>
      <div class="dk-slider" id="track" role="slider" tabindex="0" aria-label="Timeline" aria-valuemin="0">
        <div class="dk-fill" id="fill"></div>
        <span class="dk-label" id="tlabel"></span><span class="dk-value" id="tc"></span>
        <div class="dk-handle" id="knob"></div>
      </div>
    </div>
    <div class="dk-row">
      <div class="dk-seg" id="actSeg" role="group" aria-label="Act"><span class="pill"></span></div>
      <span class="dk-spacer"></span>
      <span class="dk-cap" id="speedCap">Speed</span>
      <div class="dk-seg" id="speedSeg" role="group" aria-label="Speed"><span class="pill"></span></div>
      <button class="dk-toggle" id="guides" type="button" role="switch" aria-checked="true"><span id="guidesLbl">Guides</span><span class="dk-track"><span class="dk-thumb"></span></span></button>
      <div class="dk-seg" id="langSeg" role="group" aria-label="Caption language"><span class="pill"></span></div>
      <button class="dk-btn" id="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    </div>
  </div>
</div>

<script id="dm-scene" type="application/json">__DATA__</script>
<script src="morph-engine.js"></script>
